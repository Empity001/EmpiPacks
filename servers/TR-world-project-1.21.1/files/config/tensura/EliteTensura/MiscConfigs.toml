[TITLESSystem]
	#Maximum number of title synergies that can be active simultaneously. DEFAULT: 3
	maxActiveSynergies = 3
	#Maximum number of titles that can be active simultaneously. DEFAULT: 10
	maxTitleSlots = 10
	#Number of resets to gain more slots. DEFAULT: 2
	resets_per_slot = 2
	#Number of base slots you have before the Resets Per Slots. DEFAULT: 3
	base_slots = 3

[BANKING]
	#Show the Ultimate Banking System popup alert when a mob drops cash. DEFAULT: true
	mobCashDropAlerts = false
	#Max transactions kept per UBS bank account; oldest are deleted on save. UBS has no cap of its own, so history grows forever and bank saves become lag spikes. 0 disables trimming. DEFAULT: 50
	transactionHistoryCap = 50

[ENGRAVING]
	#Enable replacing natural Rare/Epic engraving rolls with Elite Tensura custom engravings. DEFAULT: true
	enabled = true
	#Percent chance a natural Rare/Epic engraving roll is replaced by a custom engraving. DEFAULT: 25.0
	replaceChance = 25.0

[PVP]
	#Block EP transfer on player-vs-player kills: killer gains no EP, victim loses no EP/soul points. PvE deaths are unaffected. DEFAULT: true
	blockEpTransfer = true

[DEATHRECAP]
	#Show a damage recap panel on the death screen: the last few hits taken, with what the damage event chain did to each. DEFAULT: true
	enabled = true
	#How many recent damage instances to keep per player. DEFAULT: 8
	historySize = 8
