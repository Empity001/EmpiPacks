[Voice]
	#Show the Voice of the World GUI overlay for skill, title, and event messages.
	enableGui = true
	#Echo Voice messages to the chat window in addition to the overlay.
	enableChat = false
	#Play sounds when Voice messages appear.
	enableSounds = true
	#Use the Minecraft narrator to read Voice messages aloud (accessibility).
	enableNarrator = false
	#Global multiplier on every Voice message's display time. 1.0 = default per-type timing; 2.0 = twice as long; 0.5 = half. Clamped to [0.25, 5.0].
	durationScale = 1.0
	#Merge Voice messages of the same tier + header that arrive close together into one scrolling banner instead of showing them one after another.
	mergeSameTier = true
	#Coalescing window in milliseconds. Same-tier messages arriving within this window of the first one merge into a single banner. Note: each Voice message is delayed by up to this long before showing. 0 disables merging.
	mergeWindowMs = 1000
	#Maximum body lines a merged banner cycles through (the ticker scrolls the most recent this-many). The xN count in the header still reflects the full total.
	mergeMaxLines = 5
	#How many body lines are visible at once in the scrolling viewport. When a banner holds more lines than this, they scroll past one at a time (vertical ticker).
	mergeWindowLines = 2
	#Scroll speed of the merged ticker, in milliseconds per line. Lower = faster scrolling.
	mergeScrollMs = 800
	#Announce skill unlocks to all online players (false = only the player who earned it).
	globalSkillAnnouncements = false
	#Skill registry IDs that will NOT trigger a Voice announcement when gained (e.g. "elitetensura:meditation", "tensura:sage"). Other Voice events (mastery, evolution, transfer) are unaffected.
	skillAnnouncementBlacklist = []
	#Announce RESISTANCE skill unlocks. Only affects the unlock announcement; mastery, evolution, and transfer messages are unaffected.
	announceResistanceSkills = true
	#Announce INTRINSIC skill unlocks.
	announceIntrinsicSkills = true
	#Announce COMMON skill unlocks.
	announceCommonSkills = true
	#Announce EXTRA skill unlocks.
	announceExtraSkills = true
	#Announce UNIQUE skill unlocks.
	announceUniqueSkills = true
	#Announce ULTIMATE skill unlocks.
	announceUltimateSkills = true
	#Announce title unlocks to all online players (false = only the player who earned it).
	globalTitleAnnouncements = false
	#Enable milestone announcements (first skill, kill counts, evolution, etc.).
	enableMilestones = true
	#Enable world event announcements (dungeons, monsters, calamities).
	enableWorldEvents = true
	#Log all Voice events to the server console for debugging.
	debug = false
